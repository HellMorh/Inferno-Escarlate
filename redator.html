       Esse arquivo contém as matérias antigas

  <!-- ==========================================
       INTEGRAÇÃO DOS REDATORES
       MATÉRIAS ANTIGAS + ELEVENTY
  ========================================== -->

  <script>
    (async function () {

      "use strict";

      const $ = function (id) {
        return document.getElementById(id);
      };

      const parametros = new URLSearchParams(
        window.location.search
      );

      const slug = parametros.get("slug");

      /* ==========================================
         FUNÇÕES DE TEXTO
      ========================================== */

      function texto(valor) {
        return String(valor ?? "").trim();
      }

      function normalizar(valor) {
        return texto(valor)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/\s+/g, " ");
      }

      /* ==========================================
         URLS INTERNAS
      ========================================== */

      function urlInterna(valor) {

        if (!texto(valor)) {
          return "";
        }

        try {

          const url = new URL(
            texto(valor),
            window.location.origin + "/"
          );

          if (
            url.origin !== window.location.origin ||
            !["http:", "https:"].includes(url.protocol)
          ) {
            return "";
          }

          return url.href;

        } catch (erro) {
          return "";
        }
      }

      function chaveURL(valor) {

        const url = urlInterna(valor);

        if (!url) return "";

        try {
          const objeto = new URL(url);

          return objeto.pathname
            .replace(/\/+/g, "/")
            .replace(/\/$/, "")
            .toLowerCase();

        } catch (erro) {
          return "";
        }
      }

      /* ==========================================
         MENSAGENS
      ========================================== */

      function mostrarErro(mensagem) {

        $("perfil-erro").textContent = mensagem;
        $("perfil-erro").hidden = false;
      }

      /* ==========================================
         REDES SOCIAIS
      ========================================== */

      function adicionarRede(rotulo, endereco) {

        if (!texto(endereco)) return;

        try {

          const url = new URL(endereco);

          if (
            url.protocol !== "https:" &&
            url.protocol !== "http:"
          ) {
            return;
          }

          const link = document.createElement("a");

          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = rotulo;

          link.setAttribute(
            "aria-label",
            rotulo + " do redator"
          );

          $("perfil-redes").appendChild(link);

        } catch (erro) {
          // Ignora endereços inválidos.
        }
      }

      /* ==========================================
         EXIBIR PERFIL
      ========================================== */

      function apresentarRedator(redator) {

        const nome = texto(redator.nome);

        document.title =
          nome + " | Redatores | Inferno Escarlate";

        $("perfil-nome").textContent = nome;

        $("perfil-funcao").textContent =
          texto(redator.funcao) || "Redator";

        $("perfil-biografia").textContent =
          texto(redator.biografia) ||
          texto(redator.biografiaCurta);

        const imagemURL = urlInterna(
          redator.foto
        );

        if (imagemURL) {

          const imagem = document.createElement("img");

          imagem.className = "perfil-foto";
          imagem.src = imagemURL;
          imagem.alt = "Foto de " + nome;
          imagem.loading = "eager";

          $("perfil-foto-container").appendChild(
            imagem
          );

        } else {

          $("perfil-foto-container").hidden = true;

        }

        adicionarRede(
          "Instagram",
          redator.instagram
        );

        adicionarRede(
          "LinkedIn",
          redator.linkedin
        );

        adicionarRede(
          "X",
          redator.twitter
        );

        adicionarRede(
          "Site",
          redator.site
        );

        $("perfil-cabecalho").hidden = false;
        $("perfil-publicacoes").hidden = false;

        /* SEO DINÂMICO */

        const descricao =
          texto(redator.biografiaCurta) ||
          "Conheça " + nome +
          " e suas matérias no Inferno Escarlate.";

        const metaDescricao = document.querySelector(
          'meta[name="description"]'
        );

        if (metaDescricao) {
          metaDescricao.content = descricao.slice(
            0,
            160
          );
        }

        let canonical = document.querySelector(
          'link[rel="canonical"]'
        );

        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }

        canonical.href =
          window.location.origin +
          "/redator.html?slug=" +
          encodeURIComponent(texto(redator.slug));
      }

      /* ==========================================
         CARDS DAS MATÉRIAS
      ========================================== */

      function criarCard(materia) {

        const url = urlInterna(materia.url);

        const titulo = texto(
          materia.titulo || materia.title
        );

        if (!url || !titulo) {
          return null;
        }

        const card = document.createElement("article");
        card.className = "perfil-card";

        const link = document.createElement("a");
        link.href = url;

        /* IMAGEM */

        const imagemURL = urlInterna(
          materia.imagem
        );

        if (imagemURL) {

          const imagem = document.createElement("img");

          imagem.src = imagemURL;
          imagem.alt = texto(
            materia.alt || materia.imagemAlt
          ) || titulo;

          imagem.loading = "lazy";

          link.appendChild(imagem);
        }

        /* CONTEÚDO */

        const conteudo = document.createElement("div");

        conteudo.className =
          "perfil-card-conteudo";

        const categoria = document.createElement("span");

        categoria.className =
          "perfil-card-categoria";

        categoria.textContent =
          texto(materia.categoriaTexto) ||
          "Cultura pop";

        const tituloElemento =
          document.createElement("h3");

        tituloElemento.textContent = titulo;

        const resumo = document.createElement("p");

        resumo.textContent = texto(
          materia.resumo || materia.description
        );

        conteudo.appendChild(categoria);
        conteudo.appendChild(tituloElemento);
        conteudo.appendChild(resumo);

        /* DATA */

        const dataOriginal = texto(
          materia.data || materia.dataPublicacao
        );

        if (dataOriginal) {

          const dataObjeto = new Date(
            dataOriginal
          );

          if (!Number.isNaN(dataObjeto.getTime())) {

            const dataElemento =
              document.createElement("time");

            dataElemento.className =
              "perfil-card-data";

            dataElemento.dateTime =
              dataOriginal;

            dataElemento.textContent =
              dataObjeto.toLocaleDateString(
                "pt-BR",
                {
                  day: "2-digit",
                  month: "long",
                  year: "numeric",
                  timeZone: "UTC"
                }
              );

            conteudo.appendChild(
              dataElemento
            );
          }
        }

        link.appendChild(conteudo);
        card.appendChild(link);

        return card;
      }

      /* ==========================================
         CARREGAR JSON
      ========================================== */

      async function carregarJSON(caminho) {

        const resposta = await fetch(
          caminho,
          { cache: "no-cache" }
        );

        if (!resposta.ok) {

          throw new Error(
            "Não foi possível carregar " + caminho
          );
        }

        return resposta.json();
      }

      /* ==========================================
         CATÁLOGO DE MATÉRIAS ANTIGAS

         O materias.js declara:
         let MATERIAS = [...]

         Essa variável fica disponível para
         os scripts clássicos da mesma página.

         Fazemos uma cópia para trabalhar
         somente com os registros existentes.
      ========================================== */

      function obterMateriasAntigas() {

        if (
          typeof MATERIAS !== "undefined" &&
          Array.isArray(MATERIAS)
        ) {

          return [...MATERIAS];

        }

        return [];
      }

      /* ==========================================
         UNIR OS DOIS CATÁLOGOS

         - Filtra por autor
         - Elimina URLs repetidas
         - Organiza por data decrescente
      ========================================== */

      function reunirMaterias(
        antigas,
        automaticas,
        nomeAutor
      ) {

        const listaAntiga = Array.isArray(antigas)
          ? antigas
          : [];

        const listaAutomatica = Array.isArray(automaticas)
          ? automaticas
          : [];

        const todas = [
          ...listaAntiga,
          ...listaAutomatica
        ];

        const nomeNormalizado =
          normalizar(nomeAutor);

        const materiasDoAutor = todas.filter(
          function (materia) {

            return (
              normalizar(materia.autor) ===
              nomeNormalizado
            );
          }
        );

        /* EVITAR DUPLICAÇÕES */

        const urlsEncontradas = new Set();

        const semDuplicacoes = materiasDoAutor.filter(
          function (materia) {

            const chave = chaveURL(
              materia.url
            );

            if (!chave) return false;

            if (urlsEncontradas.has(chave)) {
              return false;
            }

            urlsEncontradas.add(chave);

            return true;
          }
        );

        /* MAIS RECENTES PRIMEIRO */

        semDuplicacoes.sort(
          function (a, b) {

            const dataA = Date.parse(
              a.data || a.dataPublicacao || ""
            ) || 0;

            const dataB = Date.parse(
              b.data || b.dataPublicacao || ""
            ) || 0;

            return dataB - dataA;
          }
        );

        return semDuplicacoes;
      }

      /* ==========================================
         RENDERIZAR PUBLICAÇÕES
      ========================================== */

      function apresentarMaterias(materias) {

        const grade = $("perfil-grade");

        const fragmento =
          document.createDocumentFragment();

        let quantidade = 0;

        materias.forEach(
          function (materia) {

            const card = criarCard(materia);

            if (!card) return;

            fragmento.appendChild(card);

            quantidade++;
          }
        );

        grade.replaceChildren(fragmento);

        $("perfil-sem-materias").hidden =
          quantidade > 0;

        $("perfil-contagem").textContent =
          quantidade === 1
            ? "1 matéria publicada"
            : quantidade + " matérias publicadas";
      }

      /* ==========================================
         INICIALIZAÇÃO
      ========================================== */

      try {

        if (!slug) {

          mostrarErro(
            "Nenhum redator foi selecionado."
          );

          return;
        }

        /* CARREGAR O CADASTRO DE REDATORES */

        const redatores = await carregarJSON(
          "dados/redatores.json"
        );

        if (!Array.isArray(redatores)) {

          throw new Error(
            "Cadastro de redatores inválido."
          );
        }

        const redator = redatores.find(
          function (pessoa) {

            return texto(pessoa.slug) === slug;

          }
        );

        if (!redator) {

          mostrarErro(
            "Redator não encontrado."
          );

          return;
        }

        apresentarRedator(redator);

        /* MATÉRIAS ANTIGAS */

        const antigas = obterMateriasAntigas();

        /* MATÉRIAS AUTOMÁTICAS DO ELEVENTY */

        let automaticas = [];
        let catalogoAutomaticoDisponivel = true;

        try {

          automaticas = await carregarJSON(
            "dados/materias.json"
          );

          if (!Array.isArray(automaticas)) {

            throw new Error(
              "Formato do catálogo inválido."
            );
          }

        } catch (erro) {

          catalogoAutomaticoDisponivel = false;
          automaticas = [];

          console.error(
            "Catálogo Eleventy indisponível:",
            erro
          );
        }

        /* UNIFICAR E EXIBIR */

        const materias = reunirMaterias(
          antigas,
          automaticas,
          redator.nome
        );

        apresentarMaterias(materias);

        if (!catalogoAutomaticoDisponivel) {
          const contagem = $("perfil-contagem");

          contagem.textContent +=
            " — catálogo automático indisponível";
        }

      } catch (erro) {

        mostrarErro(
          "Não foi possível carregar o perfil do redator."
        );

        console.error(erro);
      }

    })();
  </script>

</body>
</html>
