<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"

  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS PRINCIPAL -->
  <link
    rel="stylesheet"
    href="../css/style.css?v=108"
  >

  <!-- CSS EXCLUSIVO DA CATEGORIA -->
  <style>

    /* ==========================================
       MENU SUPERIOR
    ========================================== */

    .topo .menu a.link-trabalhe-comigo {
      color: #ff4356;
      font-weight: 700;
      white-space: nowrap;
    }

    .topo .menu a.link-trabalhe-comigo:hover,
    .topo .menu a.link-trabalhe-comigo:focus-visible {
      color: #ffffff;
    }

    /*
       O botão do menu responsivo utiliza
       as regras do CSS principal.

       Não ocultamos .menu-botao com
       display: none !important, pois isso
       poderia impedir o menu de funcionar
       em determinados tamanhos de tela.
    */

    /* ==========================================
       ESTRUTURA PRINCIPAL
    ========================================== */

    .pagina-listagem {
      padding-top: 78px;
    }

    /* ==========================================
       CABEÇALHO DA CATEGORIA
    ========================================== */

    .cabecalho-listagem {
      min-height: 480px;

      padding:
        130px
        4%
        70px;

      display: flex;
      align-items: flex-end;

      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.96) 0%,
          rgba(0, 0, 0, 0.82) 26%,
          rgba(0, 0, 0, 0.48) 52%,
          rgba(0, 0, 0, 0.18) 78%,
          rgba(0, 0, 0, 0.08) 100%
        ),

        linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.96) 0%,
          rgba(0, 0, 0, 0.58) 22%,
          rgba(0, 0, 0, 0.18) 48%,
          rgba(0, 0, 0, 0) 72%
        ),

        url("../imagem/banner.png")
        center
        38%
        /
        cover
        no-repeat;
    }

    /* ==========================================
       CONTEÚDO DO CABEÇALHO
    ========================================== */

    .cabecalho-listagem-conteudo {
      width: min(1200px, 100%);
      margin: 0 auto;

      position: relative;
      z-index: 2;
    }

    .cabecalho-listagem .categoria {
      display: inline-block;

      margin-bottom: 10px;

      color: #ff1738;

      font-size: 0.78rem;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .cabecalho-listagem h1 {
      margin: 8px 0 22px;

      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(5.5rem, 10vw, 9rem);

      line-height: 0.88;
      letter-spacing: 1px;
      text-transform: uppercase;

      color: #ffffff;
    }

    .cabecalho-listagem p {
      max-width: 720px;
      margin: 0;

      color: #e1e1e1;

      font-size: 1.05rem;
      line-height: 1.75;
    }

    /* ==========================================
       SEÇÃO DE MATÉRIAS
    ========================================== */

    .pagina-listagem .secao {
      position: relative;
    }

    /* ==========================================
       RESPONSIVIDADE — TABLET
    ========================================== */

    @media screen and (max-width: 800px) {

      .pagina-listagem {
        padding-top: 0;
      }

    }

    /* ==========================================
       RESPONSIVIDADE — CELULAR
    ========================================== */

    @media screen and (max-width: 600px) {

      .cabecalho-listagem {
        min-height: 420px;

        padding:
          110px
          6%
          55px;

        background:
          linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.97) 0%,
            rgba(0, 0, 0, 0.78) 50%,
            rgba(0, 0, 0, 0.28) 100%
          ),

          linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.95) 0%,
            rgba(0, 0, 0, 0.42) 42%,
            rgba(0, 0, 0, 0) 72%
          ),

          url("../imagem/banner.png")
          center
          /
          cover
          no-repeat;
      }

      .cabecalho-listagem h1 {
        font-size: clamp(4rem, 18vw, 6rem);
      }

      .cabecalho-listagem p {
        font-size: 1rem;
      }

    }

  </style>

</head>

<body data-categoria-pagina="musica">

  <!-- ==========================================
       CABEÇALHO
  ========================================== -->

  <header class="topo">

    <a
      href="../index.html"
      class="logo"
    >
      Inferno Escarlate
    </a>

    <button
      class="menu-botao"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="menu-principal"
    >
      ☰
    </button>

    <nav
      class="menu"
      id="menu-principal"
      aria-label="Menu principal"
    >

      <a href="../index.html">
        Início
      </a>

      <a href="../materias.html">
        Matérias
      </a>

      <a href="../colunas.html">
        Colunas
      </a>

      <a href="../index.html#categorias">
        Categorias
      </a>

      <a href="../contato.html">
        Contato
      </a>

      <a
        href="../trabalhe-comigo/index.html"
        class="link-trabalhe-comigo"
      >
        Trabalhe comigo
      </a>

    </nav>

  </header>

  <!-- ==========================================
       CONTEÚDO PRINCIPAL
  ========================================== -->

  <main class="pagina-listagem">

    <!-- ==========================================
         CABEÇALHO DA CATEGORIA
    ========================================== -->

    <section class="cabecalho-listagem">

      <div class="cabecalho-listagem-conteudo">

        <span class="categoria">
          Categoria
        </span>

        <h1>
          Música
        </h1>

        <p>
          Artistas, shows, festivais, lançamentos e movimentos
          que fazem parte do universo musical.
        </p>

      </div>

    </section>

    <!-- ==========================================
         MATÉRIAS DE MÚSICA
    ========================================== -->

    <section class="secao">

      <div class="titulo-secao">

        <span>
          Música • Shows • Festivais
        </span>

        <h2>
          Matérias de música
        </h2>

      </div>

      <!--
        AS MATÉRIAS SÃO CARREGADAS AUTOMATICAMENTE
        PELO ARQUIVO materias.js.

        O atributo data-categoria-pagina="musica"
        IDENTIFICA A CATEGORIA ATUAL.

        MANTER O ID categoria-materias PARA
        O JAVASCRIPT EXIBIR AS PUBLICAÇÕES.
      -->

      <div
        class="grade-materias"
        id="categoria-materias"
      >
      </div>

    </section>

  </main>

  <!-- ==========================================
       RODAPÉ GLOBAL — INFERNO ESCARLATE

       Carregado a partir de rodape.html
       localizado na raiz do projeto.

       Contém as oito colunas oficiais:
       Arquivo Idol
       Inferno Marfim
       Rock Scene Girls
       Inferno Sépia
       Inferno Púrpura
       Inferno Turquesa
       Backstage da Estagiária
       Arquivo Anime
  ========================================== -->

  <div id="rodape-global"></div>

  <!-- CARREGAMENTO DO RODAPÉ GLOBAL -->
  <script src="../js/rodape.js" defer></script>

  <!-- CARREGAMENTO AUTOMÁTICO DAS MATÉRIAS -->
  <script src="../js/materias.js?v=5"></script>

  <!-- MENU RESPONSIVO -->
  <script src="../js/script.js?v=104"></script>

</body>

</html>
